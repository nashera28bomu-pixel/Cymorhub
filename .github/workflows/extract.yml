name: Extract zip

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip files in repo root
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip found in repo root."
            exit 0
          fi
          for z in "${zips[@]}"; do
            rm -rf /tmp/extract && mkdir /tmp/extract
            unzip -q "$z" -d /tmp/extract
            # If everything sits inside one top-level folder, step into it
            if [ "$(ls -A /tmp/extract | wc -l)" -eq 1 ] && [ -d "/tmp/extract/$(ls /tmp/extract)" ]; then
              cp -a "/tmp/extract/$(ls /tmp/extract)/." .
            else
              cp -a /tmp/extract/. .
            fi
            git rm -q -f "$z"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Extract uploaded zip"
          git push
