<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="CYMOR">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4C368"/><stop offset=".55" stop-color="#8B6BFF"/><stop offset="1" stop-color="#38D6FF"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="#07060F"/>
  <!-- C: open orbital ring -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round"
